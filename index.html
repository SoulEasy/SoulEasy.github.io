function linkifyHtml(html){
  if(!html) return '';
  const parts = String(html).split(/(<[^>]*>)/);  // делим на теги и текст
  return parts.map(part => {
    if(!part) return '';
    if(part.charAt(0) === '<') return part;  // тег — оставляем
    return linkify(part);                    // текст — линкифицируем
  }).join('');
}
