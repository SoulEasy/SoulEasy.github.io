<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetQuiz — тренажёр по сетям</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#070b13;--border:rgba(255,255,255,.09);--text:#e9eefb;--muted:#8b98b0;
    --accent:#38bdf8;--accent2:#818cf8;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;
  }
  html,body{height:100%}
  body{
    margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;
    padding:24px 14px 64px;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(600px 400px at 15% 0%,rgba(56,189,248,.14),transparent 60%),
      radial-gradient(600px 400px at 85% 8%,rgba(129,140,248,.13),transparent 60%),
      radial-gradient(700px 500px at 50% 100%,rgba(52,211,153,.08),transparent 60%);
    pointer-events:none;z-index:0;
  }
  #app{width:100%;max-width:880px;position:relative;z-index:1}
  .card{
    background:linear-gradient(180deg,rgba(20,28,46,.92),rgba(13,18,32,.94));
    border:1px solid var(--border);border-radius:22px;padding:28px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.95);backdrop-filter:blur(14px);
    animation:fadeUp .35s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}

  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.6px;
     background:linear-gradient(100deg,#fff,#9fd8ff 60%,#b7bcff);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:20px;margin:0 0 10px;letter-spacing:-.3px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:14.5px;line-height:1.6}

  .topnav{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .topnav .back{
    background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);
    padding:7px 13px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;
    transition:.15s;
  }
  .topnav .back:hover{background:rgba(255,255,255,.1)}
  .topnav .title{margin-left:auto;color:var(--muted);font-size:13px}

  .stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .stat{
    flex:1;min-width:110px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;
    background:rgba(255,255,255,.025);
  }
  .stat .v{font-size:19px;font-weight:800;letter-spacing:-.3px}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
  .mode{
    border:1px solid var(--border);border-radius:14px;padding:15px;background:rgba(255,255,255,.025);
    cursor:pointer;transition:.16s;text-align:left;font-family:inherit;color:inherit;
  }
  .mode:hover{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.4);transform:translateY(-2px)}
  .mode .ico{font-size:22px;margin-bottom:8px;display:block}
  .mode .t{font-weight:700;font-size:14.5px;margin-bottom:4px}
  .mode .d{font-size:12.5px;color:var(--muted);line-height:1.5}
  .mode.disabled{opacity:.5;cursor:not-allowed}
  .mode .badge{display:inline-block;background:rgba(248,113,113,.18);color:#fca5a5;font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:800;margin-left:6px;vertical-align:middle}

  .section{margin-bottom:20px}
  .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:9px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:inherit;font-size:13.5px;font-weight:500;padding:9px 15px;border-radius:10px;
    border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;transition:.16s;
  }
  .chip:hover{color:var(--text);border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.08)}
  .chip.active{color:#04121d;background:linear-gradient(120deg,var(--accent),#7dd3fc);border-color:transparent;font-weight:700}
  .chip.active.adv{background:linear-gradient(120deg,#f472b6,#a78bfa);color:#1a0716}
  .chip.active.mid{background:linear-gradient(120deg,#38bdf8,#22d3ee);color:#04121d}
  .chip.sm{padding:6px 11px;font-size:12px}

  .switch{
    display:flex;align-items:center;gap:11px;padding:13px 15px;border:1px solid var(--border);
    border-radius:12px;background:rgba(255,255,255,.025);cursor:pointer;font-size:14px;
    color:#b9c5da;margin-bottom:20px;user-select:none;transition:.16s;
  }
  .switch:hover{border-color:rgba(56,189,248,.35)}
  .switch input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

  .btn{
    font-family:inherit;padding:13px 20px;border-radius:12px;border:1px solid var(--border);
    background:rgba(255,255,255,.05);color:var(--text);font-size:14.5px;font-weight:600;
    cursor:pointer;transition:.16s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn.primary{
    background:linear-gradient(120deg,var(--accent),var(--accent2));border:none;color:#05101c;
    font-weight:700;box-shadow:0 12px 32px -14px rgba(56,189,248,.9);
  }
  .btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.wide{width:100%}
  .btn.ghost{background:transparent}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  .hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:12px}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:800;padding:5px 11px;border-radius:7px;letter-spacing:.04em;text-transform:uppercase}
  .pill.basic{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
  .pill.middle{background:rgba(56,189,248,.15);color:#7dd3fc;border:1px solid rgba(56,189,248,.3)}
  .pill.advanced{background:rgba(244,114,182,.15);color:#f9a8d4;border:1px solid rgba(244,114,182,.3)}
  .pill.topic{background:rgba(255,255,255,.06);color:#b9c5da;border:1px solid var(--border);text-transform:none;letter-spacing:0}
  .pill.general{background:linear-gradient(120deg,rgba(251,191,36,.2),rgba(244,114,182,.18));color:#fcd34d;border:1px solid rgba(251,191,36,.4)}
  .qcount{color:var(--muted);font-size:13px}
  .right-meta{margin-left:auto;display:flex;align-items:center;gap:12px}
  .score-mini{font-size:13.5px;color:var(--ok);font-weight:800}
  .timer{font-size:14px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  .timer.urgent{color:var(--bad);animation:pulse .9s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .bookmark-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 9px;
    border-radius:8px;cursor:pointer;font-size:15px;line-height:1;transition:.15s;font-family:inherit;
  }
  .bookmark-btn:hover{border-color:var(--warn);color:var(--warn)}
  .bookmark-btn.on{background:rgba(251,191,36,.15);color:var(--warn);border-color:var(--warn)}
  .home-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:4px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;
    line-height:1;transition:.15s;font-family:inherit;font-weight:600;
  }
  .home-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.08)}

  .progress{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:22px}
  .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}

  .question{font-size:19px;line-height:1.55;font-weight:600;margin:0 0 8px;letter-spacing:-.2px}
  .diagram{margin:0 0 20px;padding:14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02);display:flex;justify-content:center}
  .diagram svg{max-width:100%;height:auto}

  .options{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .option{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    padding:14px 15px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);
    border-radius:12px;color:var(--text);font-size:14.5px;line-height:1.55;font-family:inherit;
    cursor:pointer;transition:.15s;
  }
  .option:hover:not(.locked){background:rgba(56,189,248,.09);border-color:rgba(56,189,248,.45);transform:translateX(3px)}
  .option.locked{cursor:default}
  .option .letter{
    flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:rgba(255,255,255,.07);font-size:12.5px;font-weight:800;color:var(--muted);
  }
  .option.correct{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.6)}
  .option.correct .letter{background:var(--ok);color:#05271c}
  .option.wrong{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.6)}
  .option.wrong .letter{background:var(--bad);color:#3b0a0a}
  .option.dim{opacity:.55}

  .input-row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .input-row input{
    flex:1;min-width:170px;padding:13px 15px;border-radius:12px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);color:var(--text);font-size:15px;font-family:inherit;outline:none;
    transition:.15s;
  }
  .input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .input-row input:disabled{opacity:.7}
  .input-row input.ok{border-color:var(--ok);background:rgba(52,211,153,.08)}
  .input-row input.no{border-color:var(--bad);background:rgba(248,113,113,.08)}

  .explain{
    margin-top:16px;padding:14px 16px;border-left:3px solid var(--accent);
    background:rgba(56,189,248,.07);border-radius:0 12px 12px 0;font-size:13.5px;
    line-height:1.7;color:#c9d6ea;animation:fadeIn .25s ease both;
  }
  .explain.bad{border-left-color:var(--bad);background:rgba(248,113,113,.07)}
  .explain.good{border-left-color:var(--ok);background:rgba(52,211,153,.07)}
  .related{
    margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    font-size:12px;color:var(--muted);animation:fadeIn .25s ease both;
  }
  .related .lbl{margin-right:4px}

  .difficulty-rate{
    margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
    animation:fadeIn .3s ease both;
  }
  .difficulty-rate .lbl{font-size:12.5px;color:var(--muted);margin-right:4px}
  .diff-btn{
    padding:6px 12px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);
    color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .diff-btn:hover{border-color:rgba(56,189,248,.4);color:var(--text)}
  .diff-btn.active{background:rgba(56,189,248,.15);border-color:var(--accent);color:var(--accent)}

  .actions{margin-top:18px;display:flex;gap:9px;flex-wrap:wrap}
  .actions .btn{flex:1;min-width:150px}

  .result-head{display:flex;align-items:center;gap:22px;margin-bottom:22px;flex-wrap:wrap}
  .ring{
    --p:0%;--c:var(--accent);width:140px;height:140px;flex:0 0 140px;border-radius:50%;
    background:conic-gradient(var(--c) 0 var(--p),rgba(255,255,255,.07) var(--p) 100%);
    display:grid;place-items:center;position:relative;transition:background .6s;
  }
  .ring::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 40px -8px var(--c);opacity:.45}
  .ring-inner{
    width:108px;height:108px;border-radius:50%;background:#0c1120;display:flex;flex-direction:column;
    align-items:center;justify-content:center;position:relative;z-index:1;
  }
  .pct{font-size:28px;font-weight:800;letter-spacing:-1px}
  .frac{font-size:11.5px;color:var(--muted);margin-top:2px}

  .topic-bar{margin-top:8px}
  .topic-row{
    display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;margin-bottom:5px;
    font-size:12.5px;background:rgba(255,255,255,.025);border:1px solid var(--border);
  }
  .topic-row .name{flex:0 0 auto;min-width:150px;color:#d0dbea;font-weight:600}
  .topic-row .bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .topic-row .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#22d3ee);border-radius:99px;transition:width .4s}
  .topic-row .frac{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .topic-row .run{
    flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;
    font-size:11px;padding:3px 8px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .topic-row .run:hover{border-color:var(--accent);color:var(--accent)}

  .divider{height:1px;background:var(--border);margin:22px 0}
  .filters{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .review{display:flex;flex-direction:column;gap:10px}
  .review-item{
    border:1px solid var(--border);border-left:3px solid var(--ok);border-radius:11px;
    padding:13px 15px;background:rgba(255,255,255,.022);font-size:13.5px;line-height:1.65;
  }
  .review-item.bad{border-left-color:var(--bad)}
  .ri-q{font-weight:600;margin-bottom:7px;display:flex;gap:8px}
  .ri-mark{flex:0 0 auto;font-weight:800}
  .ri-mark.ok{color:var(--ok)}
  .ri-mark.no{color:var(--bad)}
  .ri-line{color:var(--muted);font-size:13px;margin-bottom:3px}
  .ri-line span.ok{color:#6ee7b7}
  .ri-line span.no{color:#fca5a5}
  .ri-exp{margin-top:7px;color:#9fb0c9;font-size:13px;border-top:1px dashed rgba(255,255,255,.08);padding-top:7px}

  .flash-wrap{perspective:1400px;margin:24px 0}
  .flash{
    position:relative;width:100%;min-height:240px;cursor:pointer;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .flash.flipped{transform:rotateY(180deg)}
  .flash-face{
    position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:26px;border-radius:18px;text-align:center;
  }
  .flash-front{background:linear-gradient(140deg,rgba(56,189,248,.15),rgba(129,140,248,.13));border:1px solid rgba(56,189,248,.35)}
  .flash-back{
    background:linear-gradient(140deg,rgba(52,211,153,.13),rgba(34,211,238,.1));
    border:1px solid rgba(52,211,153,.35);transform:rotateY(180deg);
  }
  .flash-term{font-size:26px;font-weight:800;letter-spacing:-.4px;word-break:break-word}
  .flash-hint{margin-top:9px;color:var(--muted);font-size:12.5px}
  .flash-def{font-size:14.5px;line-height:1.7;color:#d0dbea;max-width:520px}

  .search{
    width:100%;padding:12px 15px;border-radius:12px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);color:var(--text);font-size:14.5px;font-family:inherit;
    outline:none;transition:.15s;margin-bottom:14px;
  }
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .gloss-list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;padding-right:4px}
  .gloss-item{
    padding:12px 14px;border:1px solid var(--border);border-radius:11px;
    background:rgba(255,255,255,.022);font-size:13.5px;line-height:1.65;
  }
  .gloss-item .t{font-weight:800;color:var(--accent);margin-bottom:5px;font-size:13.5px}
  .gloss-item .d{color:#c8d4e8}

  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .ach{
    padding:14px 12px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.03);
    text-align:center;transition:.2s;
  }
  .ach.unlocked{border-color:rgba(52,211,153,.5);background:linear-gradient(180deg,rgba(52,211,153,.08),rgba(52,211,153,.02))}
  .ach.locked{opacity:.45;filter:grayscale(.8)}
  .ach .ico{font-size:28px;margin-bottom:6px}
  .ach .t{font-size:13px;font-weight:700;margin-bottom:3px}
  .ach .d{font-size:11.5px;color:var(--muted);line-height:1.4}

  .calc-inputs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .calc-inputs input{
    padding:11px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03);
    color:var(--text);font-size:14.5px;font-family:inherit;outline:none;transition:.15s;width:100%;
  }
  .calc-inputs input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .calc-inputs .ip{flex:2;min-width:200px}
  .calc-inputs .pfx{flex:1;min-width:100px}
  .calc-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;margin-top:8px}
  .calc-cell{
    padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.025);
    font-size:13px;
  }
  .calc-cell .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
  .calc-cell .v{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14px;color:var(--accent);word-break:break-all}

  .terminal{
    background:#05080d;border:1px solid var(--border);border-radius:13px;padding:14px;
    font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;
    height:340px;overflow-y:auto;color:#c8d4e8;margin-bottom:10px;
  }
  .term-line{white-space:pre-wrap;word-break:break-word}
  .term-info{color:#93c5fd}
  .term-input{
    display:flex;gap:8px;align-items:center;background:#05080d;border:1px solid var(--border);
    border-radius:11px;padding:9px 13px;
  }
  .term-input .prompt{color:#6ee7b7;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
  .term-input input{
    flex:1;background:transparent;border:none;color:#c8d4e8;font-family:'SF Mono',Menlo,Consolas,monospace;
    font-size:12.5px;outline:none;padding:0;
  }

  #toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;pointer-events:none;
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .toast{
    background:linear-gradient(120deg,rgba(52,211,153,.95),rgba(34,211,238,.9));
    color:#04120d;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13.5px;
    box-shadow:0 20px 50px -12px rgba(52,211,153,.6);animation:toastIn .35s ease both;
    display:flex;align-items:center;gap:9px;max-width:90vw;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

  .term{border-bottom:1px dashed rgba(56,189,248,.5);cursor:help;padding-bottom:1px}
  .term-icon{
    display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
    background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.55);color:var(--accent);
    font-size:10px;font-weight:800;margin-left:3px;vertical-align:middle;cursor:pointer;transition:.15s;
    user-select:none;line-height:1;position:relative;top:-1px;
  }
  .term-icon:hover,.term-icon:focus-visible{
    background:var(--accent);color:#04121d;transform:scale(1.18);outline:none;
    box-shadow:0 0 12px rgba(56,189,248,.6);
  }
  .term-popup{
    position:fixed;z-index:1000;max-width:330px;min-width:220px;
    background:linear-gradient(180deg,#1b2438,#131a2c);border:1px solid rgba(56,189,248,.4);
    border-radius:14px;padding:14px 16px 15px;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.04) inset;
    font-size:13.5px;line-height:1.6;color:#dbe4f5;animation:popIn .18s ease both;
  }
  .term-popup-title{
    font-weight:800;color:var(--accent);font-size:12px;letter-spacing:.06em;margin-bottom:7px;

</style>
</head>

const STORAGE_KEY = 'netquiz.v3';
const defaultData = () => ({
  progress: {},
  stats: {
    totalAnswered: 0, totalCorrect: 0, byTopic: {},
    dayStreak: 0, lastVisit: null,
    flashViewed: 0, calcCount: 0, termOpened: 0,
    topicsDone: {}, subnetStreak: 0, generalDone: false,
    learnDone: {}
  },
  achievements: [],
  session: null
});
let DATA = loadData();
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const d = JSON.parse(raw);
    return Object.assign(defaultData(), d, {stats: Object.assign(defaultData().stats, d.stats || {})});
  }catch(e){ return defaultData(); }
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){} }
function qHash(q){ return q.q; }
function getProg(q){
  const h = qHash(q);
  if(!DATA.progress[h]) DATA.progress[h] = {ok:0,wrong:0,streak:0,lastSeen:0,nextReview:0,difficulty:null,bookmarked:false};
  return DATA.progress[h];
}
function srsSchedule(q, correct, difficulty){
  const p = getProg(q);
  p.lastSeen = Date.now();
  if(difficulty) p.difficulty = difficulty;
  if(!correct){ p.streak = 0; p.nextReview = Date.now(); return; }
  p.streak = (p.streak || 0) + 1;
  const days = [1, 2, 4, 8, 14, 30, 60][Math.min(p.streak-1, 6)];
  p.nextReview = Date.now() + days*86400000;
}
function dueQuestions(){
  const now = Date.now();
  return QUESTIONS.filter(q => {
    const p = DATA.progress[qHash(q)];
    if(!p) return false;
    return p.nextReview && p.nextReview <= now && (p.wrong > 0 || p.ok > 0);
  });
}
function wrongQuestions(){
  return QUESTIONS.filter(q => {
    const p = DATA.progress[qHash(q)];
    if(!p) return false;
    return (p.wrong||0) > (p.ok||0);
  });
}
function bookmarkedQuestions(){
  return QUESTIONS.filter(q => DATA.progress[qHash(q)] && DATA.progress[qHash(q)].bookmarked);
}
function checkDayStreak(){
  const today = new Date().toISOString().slice(0,10);
  const s = DATA.stats;
  if(s.lastVisit === today) return;
  if(s.lastVisit){
    const last = new Date(s.lastVisit);
    const diff = Math.floor((new Date(today) - last)/86400000);
    if(diff === 1) s.dayStreak = (s.dayStreak||0) + 1;
    else if(diff > 1) s.dayStreak = 1;
  } else s.dayStreak = 1;
  s.lastVisit = today;
  saveData();
  if(s.dayStreak >= 3) unlock('streak-3');
  if(s.dayStreak >= 7) unlock('streak-7');
}
function unlock(id){
  if(DATA.achievements.includes(id)) return;
  DATA.achievements.push(id);
  saveData();
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if(a) toast(`${a.icon} Достижение: ${a.t}`);
}
function toast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{ el.style.animation = 'toastOut .35s ease forwards'; setTimeout(()=>el.remove(), 350); }, 2600);
}

const _keys = Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
const _lookup = {};
Object.keys(GLOSSARY).forEach(k => _lookup[k.toLowerCase()] = k);
const _rx = new RegExp('\\b(' + _keys.map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')\\b','gi');
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(text){
  if(!text) return '';
  const out = []; let last = 0; let m;
  _rx.lastIndex = 0;
  while((m = _rx.exec(text)) !== null){
    const matched = m[0];
    const key = _lookup[matched.toLowerCase()];
    if(!key) continue;
    if(m.index > last) out.push(escapeHtml(text.slice(last, m.index)));
    out.push('<span class="term" data-term="'+escapeHtml(key)+'">'+escapeHtml(matched)+
      '<span class="term-icon" role="button" tabindex="0">?</span></span>');
    last = m.index + matched.length;
  }
  if(last < text.length) out.push(escapeHtml(text.slice(last)));
  return out.join('');
}
function relatedTerms(text){
  if(!text) return [];
  const found = new Set(); let m;
  _rx.lastIndex = 0;
  while((m = _rx.exec(text)) !== null){
    const key = _lookup[m[0].toLowerCase()];
    if(key) found.add(key);
  }
  return Array.from(found).slice(0, 8);
}
const popupEl = document.getElementById('termPopup');
popupEl.querySelector('.term-popup-close').addEventListener('click', hideTermPopup);
function showTermPopup(termEl){
  if(!termEl) return;
  const key = termEl.dataset.term;
  const def = GLOSSARY[key];
  if(!def) return;
  popupEl.querySelector('.term-popup-title').textContent = key;
  popupEl.querySelector('.term-popup-body').textContent = def;
  popupEl.hidden = false;
  popupEl.style.left = '-9999px';
  popupEl.style.top = '0px';
  const r = termEl.getBoundingClientRect();
  const pw = popupEl.offsetWidth, ph = popupEl.offsetHeight, m = 10;
  let left = r.left + r.width/2 - pw/2;
  left = Math.max(m, Math.min(left, window.innerWidth - pw - m));
  let top = r.top - ph - m;
  if(top < m) top = r.bottom + m;
  if(top + ph > window.innerHeight - m) top = Math.max(m, window.innerHeight - ph - m);
  popupEl.style.left = left + 'px';
  popupEl.style.top = top + 'px';
  DATA.stats.termOpened = (DATA.stats.termOpened||0) + 1;
  if(DATA.stats.termOpened >= 30) unlock('term-30');
  saveData();
}
function hideTermPopup(){ popupEl.hidden = true; }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function poolFor(level, topics){
  let pool = QUESTIONS.slice();
  if(level !== 'all') pool = pool.filter(q => q.level === level);
  if(topics && topics.length) pool = pool.filter(q => topics.includes(q.topic));
  return pool;
}
function makeQuestion(src){
  const q = {
    level:src.level, topic:src.topic, type:src.type||'choice',
    text:src.q, explain:src.explain, diagram:src.diagram||null
  };
  if(q.type === 'input'){
    q.answer = String(src.answer);
    q.accept = (src.accept||[]).map(String);
  } else {
    q.opts = shuffle(src.opts.map((t,i)=>({text:t, correct:i===src.a})));
  }
  q.answered = false; q.chosen = -1; q.userInput = '';
  q.userDifficulty = null;
  return q;
}
function isCorrectQ(q){
  if(!q.answered) return false;
  if(q.type === 'input'){
    const val = (q.userInput||'').trim().toLowerCase().replace(/\s+/g,'');
    if(!val) return false;
    return q.accept.some(a => a.toLowerCase().replace(/\s+/g,'') === val);
  }
  return q.chosen >= 0 && q.opts[q.chosen] && q.opts[q.chosen].correct === true;
}
function checkInput(q, val){
  const v = (val||'').trim().toLowerCase().replace(/\s+/g,'');
  if(!v) return false;
  return q.accept.some(a => a.toLowerCase().replace(/\s+/g,'') === v);
}
function ipToUint(ip){
  const p = ip.trim().split('.').map(Number);
  if(p.length !== 4 || p.some(x => isNaN(x) || x<0 || x>255)) return null;
  return ((p[0]<<24) | (p[1]<<16) | (p[2]<<8) | p[3]) >>> 0;
}
function uintToIp(n){
  n = n >>> 0;
  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
}
function prefixToMask(p){
  if(p<0||p>32) return null;
  return p===0 ? 0 : (0xFFFFFFFF << (32-p)) >>> 0;
}

/* ============================================================
   ТЕСТ
   ============================================================ */
function startQuizQuestions(rawQuestions, mode, opts){
  opts = opts || {};
  if(!rawQuestions.length){ alert('Нет подходящих вопросов.'); return; }
  state.mode = mode;
  // Единственная точка конвертации сырых вопросов в игровые объекты
  state.questions = rawQuestions.map(makeQuestion);
  state.idx = 0;
  state.screen = 'quiz';
  state.timed = !!opts.timed;
  state.timeLeft = TIME_LIMIT;
  state.examSecondsLeft = opts.examSeconds || 0;
  clearInterval(state.examTimer);
  if(state.examSecondsLeft > 0){
    state.examTimer = setInterval(()=>{
      state.examSecondsLeft--;
      updateExamBanner();
      if(state.examSecondsLeft <= 0){ clearInterval(state.examTimer); finishQuiz(true); }
    }, 1000);
  }
  renderQuiz();
}

function renderQuiz(){
  clearInterval(state.timer);
  const q = state.questions[state.idx];
  if(!q){ finishQuiz(); return; }

  const total = state.questions.length;
  const correctCount = state.questions.filter(isCorrectQ).length;
  const meta = LEVEL_META[q.level];
  const letters = ['A','B','C','D','E'];
  const p = getProg(q);
  const isExam = state.mode === 'exam';
  const isGeneral = state.mode === 'general';

  let bodyHtml = '';
  if(q.diagram && DIAGRAMS[q.diagram]) bodyHtml += `<div class="diagram">${DIAGRAMS[q.diagram]}</div>`;

  let answerHtml = '';
  if(q.type === 'input'){
    const cls = q.answered ? (isCorrectQ(q)?'ok':'no') : '';
    answerHtml = `
      <div class="input-row">
        <input type="text" id="inputAnswer" value="${escapeHtml(q.userInput)}" ${q.answered?'disabled':''} class="${cls}" placeholder="Введите ответ…">
        <button class="btn primary" id="submitInput" ${q.answered?'disabled':''}>Проверить</button>
      </div>`;
  } else {
    answerHtml = `<div class="options">${q.opts.map((o,i)=>{
      let cls = 'option';
      if(q.answered){
        cls += ' locked';
        if(o.correct) cls += ' correct';
        else if(i === q.chosen) cls += ' wrong';
        else cls += ' dim';
      }
      return `<button class="${cls}" data-opt="${i}"><span class="letter">${letters[i]}</span><span>${linkify(o.text)}</span></button>`;
    }).join('')}</div>`;
  }

  let explainHtml = '', relatedHtml = '', diffHtml = '';
  if(q.answered){
    const ok = isCorrectQ(q);
    const correctForExplain = q.type === 'input' ? q.answer : (q.opts.find(o=>o.correct)||{}).text;
    if(!isExam){
      const head = ok
        ? '<b>✅ Верно!</b> '
        : (q.userInput==='' || q.chosen===-1
            ? `<b>⏰ Не отвечено.</b> Правильный ответ: <b>${escapeHtml(correctForExplain)}</b>. `
            : `<b>❌ Неверно.</b> Правильный ответ: <b>${escapeHtml(correctForExplain)}</b>. `);
      explainHtml = `<div class="explain ${ok?'good':'bad'}">${head}${linkify(q.explain)}</div>`;
      const rel = relatedTerms((q.text||'') + ' ' + (q.explain||'')).filter(t => t.toLowerCase() !== q.topic.toLowerCase());
      if(rel.length){
        relatedHtml = `<div class="related"><span class="lbl">📎 Связанные термины:</span>${rel.map(t=>
          `<button class="chip sm" data-term-open="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}</div>`;
      }
      if(!q.userDifficulty){
        diffHtml = `<div class="difficulty-rate"><span class="lbl">Как было?</span>
          <button class="diff-btn" data-diff="easy">😎 Легко</button>
          <button class="diff-btn" data-diff="normal">🙂 Норм</button>
          <button class="diff-btn" data-diff="hard">😰 Сложно</button>
        </div>`;
      }
    }
  }

  const examBanner = isExam ? `
    <div class="exam-banner">
      <span>🏆 Экзамен · до конца <b id="examTimer">${formatTime(state.examSecondsLeft)}</b></span>
      <span>Отвечено: <b>${state.questions.filter(x=>x.answered).length}/${total}</b></span>
    </div>` : '';

  const generalBanner = isGeneral ? `
    <div class="exam-banner" style="background:linear-gradient(120deg,rgba(251,191,36,.13),rgba(244,114,182,.1));border-color:rgba(251,191,36,.4);color:#fcd34d">
      <span>📋 Общий тест · ${TOPICS.length} тем</span>
      <span>Отвечено: <b>${state.questions.filter(x=>x.answered).length}</b> / ${total}</span>
    </div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="topbar">
        <button class="home-btn" data-quiz-home title="В главное меню">← Меню</button>
        <button class="bookmark-btn ${p.bookmarked?'on':''}" data-bookmark title="В закладки">${p.bookmarked?'★':'☆'}</button>
        ${isGeneral ? `<span class="pill general">📋 Общий</span>` : ''}
        <span class="pill ${meta.cls}">${meta.name}</span>
        <span class="pill topic">${topicIcon(q.topic)} ${escapeHtml(topicName(q.topic))}</span>
        <span class="qcount">${state.idx+1} / ${total}</span>
        <div class="right-meta">
          <span class="score-mini">✓ ${correctCount}</span>
          ${state.timed ? `<span class="timer" id="timerVal">${Math.ceil(state.timeLeft)}с</span>` : ''}
        </div>
      </div>

      ${examBanner}${generalBanner}
      <div class="progress"><div class="progress-fill" style="width:${((state.idx + (q.answered?1:0))/total)*100}%"></div></div>

      <h2 class="question">${linkify(q.text)}</h2>
      ${bodyHtml}
      ${answerHtml}
      ${explainHtml}
      ${relatedHtml}
      ${diffHtml}

      ${q.answered || isExam ? `<div class="actions">
        <button class="btn primary" data-next>${state.idx === total-1 ? 'Завершить' : 'Далее →'}</button>
        ${!isExam && state.idx < total-1 ? `<button class="btn ghost" data-skip style="flex:0 0 auto;min-width:120px">Пропустить</button>` : ''}
      </div>` : ''}
    </div>
  `;

  const inp = document.getElementById('inputAnswer');
  if(inp && !q.answered){
    inp.focus();
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submitInput(); } });
  }
  if(state.timed && !q.answered) startTimer();
  else if(state.timed) updateTimerEl();
}

function formatTime(s){
  s = Math.max(0, s|0);
  const m = Math.floor(s/60), ss = s%60;
  return m + ':' + String(ss).padStart(2,'0');
}
function updateExamBanner(){
  const el = document.getElementById('examTimer');
  if(el) el.textContent = formatTime(state.examSecondsLeft);
}
function startTimer(){
  state.timeLeft = TIME_LIMIT;
  updateTimerEl();
  state.timer = setInterval(()=>{
    state.timeLeft -= 0.1;
    if(state.timeLeft <= 0){ state.timeLeft = 0; updateTimerEl(); clearInterval(state.timer); timeOut(); }
    else updateTimerEl();
  }, 100);
}
function updateTimerEl(){
  const el = document.getElementById('timerVal');
  if(!el) return;
  el.textContent = Math.ceil(state.timeLeft) + 'с';
  el.classList.toggle('urgent', state.timeLeft <= 10);
}
function timeOut(){
  const q = state.questions[state.idx];
  if(!q || q.answered) return;
  q.answered = true; q.chosen = -1; q.userInput = '';
  commitAnswer(q, false);
  renderQuiz();
}
function handleAnswer(i){
  const q = state.questions[state.idx];
  if(!q || q.answered || q.type === 'input') return;
  clearInterval(state.timer);
  q.answered = true; q.chosen = i;
  commitAnswer(q, q.opts[i].correct);
  renderQuiz();
}
function submitInput(){
  const q = state.questions[state.idx];
  if(!q || q.answered || q.type !== 'input') return;
  const inp = document.getElementById('inputAnswer');
  const val = inp ? inp.value : '';
  clearInterval(state.timer);
  q.userInput = val;
  q.answered = true;
  commitAnswer(q, checkInput(q, val));
  renderQuiz();
}
function commitAnswer(q, correct){
  const p = getProg(q);
  if(correct) p.ok = (p.ok||0) + 1; else p.wrong = (p.wrong||0) + 1;
  srsSchedule(q, correct, q.userDifficulty || null);
  DATA.stats.totalAnswered = (DATA.stats.totalAnswered||0) + 1;
  if(correct) DATA.stats.totalCorrect = (DATA.stats.totalCorrect||0) + 1;
  if(!DATA.stats.byTopic[q.topic]) DATA.stats.byTopic[q.topic] = {ok:0,n:0};
  DATA.stats.byTopic[q.topic].n++;
  if(correct) DATA.stats.byTopic[q.topic].ok++;
  if(q.topic === 'subnetting'){
    if(correct) DATA.stats.subnetStreak = (DATA.stats.subnetStreak||0) + 1;
    else DATA.stats.subnetStreak = 0;
    if(DATA.stats.subnetStreak >= 10) unlock('subnet-master');
  }
  saveData();
  saveSession();
}
function saveSession(){
  DATA.session = {
    mode: state.mode,
    questions: state.questions.map(q => ({
      level:q.level, topic:q.topic, type:q.type, text:q.text, explain:q.explain,
      diagram:q.diagram, opts:q.opts, answer:q.answer, accept:q.accept,
      answered:q.answered, chosen:q.chosen, userInput:q.userInput, userDifficulty:q.userDifficulty
    })),
    idx: state.idx, timed: state.timed,
    examSecondsLeft: state.examSecondsLeft
  };
  saveData();
}
function nextQuestion(){
  clearInterval(state.timer);
  if(state.idx < state.questions.length - 1){ state.idx++; renderQuiz(); saveSession(); }
  else finishQuiz();
}
function skipQuestion(){
  if(state.idx < state.questions.length - 1){ state.idx++; renderQuiz(); }
  else finishQuiz();
}
function finishQuiz(force){
  clearInterval(state.timer); clearInterval(state.examTimer);
  DATA.session = null;
  const total = state.questions.length;
  const correct = state.questions.filter(isCorrectQ).length;
  const pct = total ? Math.round((correct/total)*100) : 0;

  const byTopic = {};
  state.questions.forEach(q => {
    if(!byTopic[q.topic]) byTopic[q.topic] = {ok:0,n:0};
    byTopic[q.topic].n++;
    if(isCorrectQ(q)) byTopic[q.topic].ok++;
  });
  Object.entries(byTopic).forEach(([t, s])=>{
    if(s.n >= 5 && s.ok === s.n){
      const topicPool = QUESTIONS.filter(q=>q.topic===t).length;
      if(topicPool >= 5) unlock('topic-complete');
    }
    if(t === 'security' && s.n >= 5 && s.ok/s.n >= 0.9) unlock('sec-expert');
    if(t === 'wireless' && s.n >= 5 && s.ok/s.n >= 0.9) unlock('wifi-master');
  });
  Object.keys(byTopic).forEach(t => DATA.stats.topicsDone[t] = true);
  if(Object.keys(DATA.stats.topicsDone).length >= 5) unlock('topics-5');
  if(TOPICS.every(t => DATA.stats.topicsDone[t])) unlock('all-topics');

  unlock('first-test');
  if(pct === 100 && total >= 10) unlock('perfect');
  if(state.mode === 'exam') unlock('marathon');
  const hour = new Date().getHours();
  if(hour >= 2 && hour < 5) unlock('night-owl');
  if(state.mode === 'classic' && state.level === 'advanced' && pct >= 90) unlock('bgp-pro');

  if(state.mode === 'general'){
    const wasFullBank = state.questions.length === QUESTIONS.length;
    const answeredCount = state.questions.filter(x => x.answered).length;
    if(wasFullBank && answeredCount >= Math.floor(QUESTIONS.length * 0.9)){
      DATA.stats.generalDone = true;
      unlock('general-done');
    } else if(answeredCount >= 50){
      DATA.stats.generalDone = true;
    }
  }

  saveData();
  state.screen = 'result';
  state.reviewFilter = 'all';
  renderResult(force);
}

/* ============================================================
   РЕЗУЛЬТАТ
   ============================================================ */
function renderResult(force){
  const total = state.questions.length;
  const correct = state.questions.filter(isCorrectQ).length;
  const pct = total ? Math.round((correct/total)*100) : 0;
  const isGeneral = state.mode === 'general';

  let verdict, color, note;
  if(pct >= 90){ verdict='Отличный результат!'; color='#34d399'; note='Уровень уверенного сетевого инженера.'; }
  else if(pct >= 75){ verdict='Хороший результат'; color='#38bdf8'; note='Просмотрите разбор, чтобы закрыть пробелы.'; }
  else if(pct >= 50){ verdict='Неплохо, но есть куда расти'; color='#fbbf24'; note='Повторите слабые темы.'; }
  else { verdict='Стоит повторить материал'; color='#f87171'; note='Разберите объяснения — и попробуйте снова.'; }

  const byTopic = {};
  state.questions.forEach(q=>{
    if(!byTopic[q.topic]) byTopic[q.topic] = {ok:0,n:0};
    byTopic[q.topic].n++;
    if(isCorrectQ(q)) byTopic[q.topic].ok++;
  });
  const topicRows = Object.entries(byTopic).map(([t,s])=>{
    const p = Math.round((s.ok/s.n)*100);
    const c = p >= 80 ? '#34d399' : p >= 50 ? '#fbbf24' : '#f87171';
    return `<div class="topic-row">
      <span class="name">${topicIcon(t)} ${escapeHtml(topicName(t))}</span>
      <div class="bar"><span style="width:${p}%;background:${c}"></span></div>
      <span class="frac">${s.ok}/${s.n}</span>
      ${p<80 ? `<button class="run" data-topic-run="${t}">Прогнать</button>` : ''}
    </div>`;
  }).join('');

  const wrongCount = state.questions.filter(q => !isCorrectQ(q)).length;
  const list = state.reviewFilter === 'wrong' ? state.questions.filter(q => !isCorrectQ(q)) : state.questions;

  const reviewHtml = list.length === 0
    ? `<div class="explain good">Ошибок нет! 🎉</div>`
    : list.map(q => {
        const ok = isCorrectQ(q);
        const correctText = q.type==='input' ? q.answer : (q.opts.find(o=>o.correct)||{}).text;
        const chosenText = q.type==='input' ? (q.userInput || '— пусто —') : (q.chosen>=0 ? q.opts[q.chosen].text : '— не отвечено —');
        return `
          <div class="review-item ${ok?'':'bad'}">
            <div class="ri-q">
              <span class="ri-mark ${ok?'ok':'no'}">${ok?'✓':'✕'}</span>
              <span>${linkify(q.text)} <span style="color:#6b7a94;font-weight:400;font-size:11.5px">· ${LEVEL_META[q.level].name} · ${topicName(q.topic)}</span></span>
            </div>
            <div class="ri-line">Ваш ответ: <span class="${ok?'ok':'no'}">${linkify(chosenText)}</span></div>
            ${ok?'':`<div class="ri-line">Правильный ответ: <span class="ok">${linkify(correctText)}</span></div>`}
            <div class="ri-exp">${linkify(q.explain)}</div>
          </div>`;
      }).join('');

  const generalBadge = isGeneral ? `
    <div class="exam-banner" style="background:linear-gradient(120deg,rgba(251,191,36,.13),rgba(244,114,182,.1));border-color:rgba(251,191,36,.4);color:#fcd34d;margin-bottom:16px">
      <span>📋 Общий тест по всем темам</span>
      <span>Охвачено тем: <b>${Object.keys(byTopic).length}</b> / ${TOPICS.length}</span>
    </div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="topnav"><button class="back" data-go="home">← На главную</button><span class="title">Результат</span></div>
      ${generalBadge}
      ${force ? '<div class="exam-banner" style="background:linear-gradient(120deg,rgba(248,113,113,.15),rgba(244,114,182,.1));border-color:rgba(248,113,113,.4);color:#fca5a5">⏰ Время экзамена истекло</div>' : ''}

      <div class="result-head">
        <div class="ring" style="--p:${pct}%;--c:${color}">
          <div class="ring-inner">
            <div class="pct" style="color:${color}">${pct}%</div>
            <div class="frac">${correct} / ${total}</div>
          </div>
        </div>
        <div class="result-text">
          <h2>${verdict}</h2>
          <p>${note}</p>
        </div>
      </div>

      <div class="label">Разбор по темам</div>
      <div class="topic-bar">${topicRows || '<div class="hint">Нет данных</div>'}</div>

      <div class="divider"></div>

      <div class="filters">
        <button class="chip ${state.reviewFilter==='all'?'active':''}" data-filter="all">Все (${total})</button>
        <button class="chip ${state.reviewFilter==='wrong'?'active':''}" data-filter="wrong">Ошибки (${wrongCount})</button>
      </div>

      <div class="review">${reviewHtml}</div>

      <div class="actions">
        <button class="btn primary" data-restart="same">Ещё раз</button>
        <button class="btn" data-go="home">На главную</button>
      </div>

function renderSubnet(){
  const ip = state.calcIp, pfx = state.calcPrefix;
  const ipInt = ipToUint(ip);
  const mask = prefixToMask(pfx);
  let resultHtml = '';
  if(ipInt !== null && mask !== null){
    const net = (ipInt & mask) >>> 0;
    const bcast = (net | (~mask >>> 0)) >>> 0;
    const hosts = pfx >= 31 ? 0 : Math.max(0, (bcast - net - 1));
    resultHtml = `
      <div class="calc-out">
        <div class="calc-cell"><div class="l">Адрес сети</div><div class="v">${uintToIp(net)}</div></div>
        <div class="calc-cell"><div class="l">Широковещательный</div><div class="v">${uintToIp(bcast)}</div></div>
        <div class="calc-cell"><div class="l">Маска</div><div class="v">${uintToIp(mask)}</div></div>
        <div class="calc-cell"><div class="l">Первый хост</div><div class="v">${hosts>0?uintToIp(net+1):'—'}</div></div>
        <div class="calc-cell"><div class="l">Последний хост</div><div class="v">${hosts>0?uintToIp(bcast-1):'—'}</div></div>
        <div class="calc-cell"><div class="l">Всего адресов</div><div class="v">${Math.pow(2, 32-pfx)}</div></div>
        <div class="calc-cell"><div class="l">Хостов</div><div class="v">${hosts}</div></div>
        <div class="calc-cell"><div class="l">Префикс</div><div class="v">/${pfx}</div></div>
      </div>`;
  } else {
    resultHtml = '<div class="hint">Введите корректный IP-адрес и префикс (0–32)</div>';
  }
  app.innerHTML = `
    <div class="card">
      <div class="topnav"><button class="back" data-go="home">← На главную</button><span class="title">Калькулятор подсетей</span></div>
      <div class="calc-inputs">
        <input class="ip" type="text" id="calcIp" value="${escapeHtml(ip)}" placeholder="IP-адрес (например, 192.168.1.10)">
        <input class="pfx" type="number" id="calcPfx" value="${pfx}" min="0" max="32" placeholder="Префикс">
      </div>
      ${resultHtml}
      <div class="hint" style="text-align:left;margin-top:14px">💡 Префикс — число единичных бит в маске. /24 = 255.255.255.0.</div>
    </div>
  `;
  const ipInp = document.getElementById('calcIp');
  const pfxInp = document.getElementById('calcPfx');
  if(ipInp) ipInp.addEventListener('input', e=>{
    state.calcIp = e.target.value;
    DATA.stats.calcCount = (DATA.stats.calcCount||0) + 1;
    if(DATA.stats.calcCount >= 10) unlock('calc-10');
    saveData();
    renderSubnet();
    const el = document.getElementById('calcIp');
    el.focus(); el.setSelectionRange(state.calcIp.length, state.calcIp.length);
  });
  if(pfxInp) pfxInp.addEventListener('input', e=>{
    let v = parseInt(e.target.value, 10);
    if(isNaN(v)) v = 0;
    state.calcPrefix = Math.max(0, Math.min(32, v));
    renderSubnet();
    document.getElementById('calcPfx').focus();
  });
}

function renderBinaryViz(ip, prefix){
  const octets = ip.split('.').map(n => parseInt(n, 10));
  let bitsUsed = 0;
  let html = '<div class="binary-viz">';
  octets.forEach(o => {
    const bits = o.toString(2).padStart(8, '0').split('');
    html += '<div class="binary-octet">';
    html += `<div class="dec">${o}</div>`;
    html += '<div class="bits">';
    bits.forEach((b, bi) => {
      const bitPos = bitsUsed + bi;
      const isNet = bitPos < prefix;
      const isOn = b === '1';
      const cls = `bit ${isNet ? 'net-bit' : 'host-bit'} ${isOn ? 'on' : ''}`;
      html += `<span class="${cls}">${b}</span>`;
    });
    html += '</div></div>';
    bitsUsed += 8;
  });
  html += '</div>';
  html += `
    <div class="binary-legend">
      <span><span class="dot net"></span>Биты сети — ${prefix}</span>
      <span><span class="dot host"></span>Биты хоста — ${32 - prefix}</span>
    </div>`;
  return html;
}

          <input type="text" id="learnInput" value="${answered ? escapeHtml(state.learnAnswer) : ''}" ${answered?'disabled':''} class="${inputCls}" placeholder="Ваш ответ…">
          <button class="btn primary" id="learnSubmit" ${answered?'disabled':''}>Проверить</button>
        </div>
        ${hintBtn}
        ${hintHtml}
        ${feedbackHtml}
      </div>
    `;

    actionsHtml = answered ? `
      <div class="actions">
        <button class="btn primary" data-learn-next>
          ${state.learnStep === total-1 ? 'Завершить урок' : 'Далее →'}
        </button>
      </div>` : '';
  }

  app.innerHTML = `
    <div class="card">
      <div class="topnav"><button class="back" data-learn-exit>← К урокам</button><span class="title">${t.icon} ${escapeHtml(t.name)}</span></div>
      <div class="learn-header">
        <span class="learn-step-label">Шаг ${state.learnStep+1} из ${total}</span>
        <div class="right-meta"><span class="qcount">${Math.round(pct)}%</span></div>
      </div>
      <div class="learn-progress"><span style="width:${pct}%"></span></div>

      <h2 class="learn-title">${linkify(step.title)}</h2>
      ${contentHtml}
      ${actionsHtml}
    </div>
  `;

  if(step.type === 'input'){
    const inp = document.getElementById('learnInput');
    if(inp && !inp.disabled){
      inp.focus();
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); learnSubmitInput(); }
      });
    }
  }
}

function learnStart(id){
  state.tutorialId = id;
  state.learnStep = 0;
  state.learnAnswer = null;
  state.learnChoice = null;
  state.learnShowHint = false;
  state.screen = 'learn';
  render();
}
function learnNext(){
  const t = TUTORIALS.find(x => x.id === state.tutorialId);
  if(!t) return;
  const step = t.steps[state.learnStep];
  if(step && (step.type === 'choice' || step.type === 'input')){
    const answered = step.type === 'choice' ? state.learnChoice !== null : state.learnAnswer !== null;
    if(!answered) return;
  }
  state.learnStep++;
  state.learnAnswer = null;
  state.learnChoice = null;
  state.learnShowHint = false;
  render();
}
function learnAnswerChoice(i){
  const t = TUTORIALS.find(x => x.id === state.tutorialId);
  if(!t) return;
  if(state.learnChoice !== null) return;
  state.learnChoice = i;
  render();
}
function learnSubmitInput(){
  const t = TUTORIALS.find(x => x.id === state.tutorialId);
  if(!t) return;
  if(state.learnAnswer !== null) return;
  const inp = document.getElementById('learnInput');
  if(!inp) return;
  const val = inp.value.trim();
  if(!val) return;
  state.learnAnswer = val;
  render();
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'learnSetup') renderLearnSetup();
  else if(state.screen === 'learn') renderLearn();
  else if(state.screen === 'generalSetup') renderGeneralSetup();
  else if(state.screen === 'classicSetup') renderClassicSetup();
  else if(state.screen === 'quiz') renderQuiz();
  else if(state.screen === 'result') renderResult();
  else if(state.screen === 'flashcards') renderFlashcards();
  else if(state.screen === 'glossary') renderGlossary();
  else if(state.screen === 'progress') renderProgress();
  else if(state.screen === 'achievements') renderAchievements();
  else if(state.screen === 'subnet') renderSubnet();
  else if(state.screen === 'terminal') renderTerminal();
  else if(state.screen === 'settings') renderSettings();
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
app.addEventListener('click', (e)=>{
  // === Интерактивное обучение ===
  const learnStartBtn = e.target.closest('[data-learn-start]');
  if(learnStartBtn){ learnStart(learnStartBtn.dataset.learnStart); return; }

  const learnNextBtn = e.target.closest('[data-learn-next]');
  if(learnNextBtn){ learnNext(); return; }

  const learnChoiceBtn = e.target.closest('[data-learn-choice]');
  if(learnChoiceBtn){ learnAnswerChoice(Number(learnChoiceBtn.dataset.learnChoice)); return; }

  if(e.target.closest('#learnSubmit')){ learnSubmitInput(); return; }

  if(e.target.closest('[data-learn-hint]')){
    state.learnShowHint = true;
    render();
    return;
  }

  if(e.target.closest('[data-learn-exit]')){
    state.screen = 'learnSetup';
    state.tutorialId = null;
    render();
    return;
  }

  const learnRestart = e.target.closest('[data-learn-restart]');
  if(learnRestart){ learnStart(learnRestart.dataset.learnRestart); return; }

  // === Возврат в меню из теста ===
  if(e.target.closest('[data-quiz-home]')){
    const q = state.questions[state.idx];
    const unanswered = q && !q.answered;
    const msg = unanswered
      ? 'Выйти в главное меню? Текущий вопрос не сохранён, но ответы на остальные — сохранены.'
      : 'Выйти в главное меню? Прогресс теста сохранён.';
    if(!confirm(msg)) return;
    clearInterval(state.timer);
    clearInterval(state.examTimer);
    if(state.questions.length && state.screen === 'quiz'){
      saveSession();
      toast('💾 Прогресс сохранён');
    }
    state.screen = 'home';
    state.questions = [];
    state.idx = 0;
    render();
    return;
  }

  // === Термины / linkify ===
  const termIcon = e.target.closest('.term-icon');
  if(termIcon){ e.preventDefault(); e.stopPropagation(); showTermPopup(termIcon.closest('.term')); return; }

  const termOpen = e.target.closest('[data-term-open]');
  if(termOpen){
    const key = termOpen.dataset.termOpen;
    const fake = document.createElement('span');
    fake.dataset.term = key;
    fake.getBoundingClientRect = () => termOpen.getBoundingClientRect();
    showTermPopup(fake);
    return;
  }

  // === Ответы ===
  const optBtn = e.target.closest('[data-opt]');
  if(optBtn){ handleAnswer(Number(optBtn.dataset.opt)); return; }

  if(e.target.closest('#submitInput')){ submitInput(); return; }
  if(e.target.closest('[data-next]')){ nextQuestion(); return; }
  if(e.target.closest('[data-skip]')){ skipQuestion(); return; }

  if(e.target.closest('[data-bookmark]')){
    const q = state.questions[state.idx];
    if(!q) return;
    const p = getProg(q);
    p.bookmarked = !p.bookmarked;
    saveData(); renderQuiz(); return;
  }

  const dbtn = e.target.closest('[data-diff]');
  if(dbtn){
    const q = state.questions[state.idx];
    if(!q) return;
    q.userDifficulty = dbtn.dataset.diff;
    const p = getProg(q);
    p.difficulty = q.userDifficulty;
    if(q.userDifficulty === 'easy') p.nextReview = (p.nextReview||Date.now()) + 2*86400000;
    else if(q.userDifficulty === 'hard') p.nextReview = Date.now() + 3600000;
    saveData(); renderQuiz(); return;
  }

  // === Запуск тестов ===
  if(e.target.closest('#startClassic')){
    const topics = state.selectedTopics.length ? state.selectedTopics : null;
    const pool = poolFor(state.level, topics);
    const qs = shuffle(pool).slice(0, state.count === 0 ? pool.length : state.count);
    startQuizQuestions(qs, 'classic', {timed: state.timed});
    return;
  }

  if(e.target.closest('[data-start-general]')){
    // ВАЖНО: передаём сырые вопросы, конвертация — внутри startQuizQuestions
    const qs = shuffle(QUESTIONS);
    startQuizQuestions(qs, 'general', {timed: state.timed});
    return;
  }

  const topicToggle = e.target.closest('[data-topic-toggle]');
  if(topicToggle){
    const id = topicToggle.dataset.topicToggle;
    const idx = state.selectedTopics.indexOf(id);
    if(idx >= 0) state.selectedTopics.splice(idx,1);
    else state.selectedTopics.push(id);
    renderClassicSetup(); return;
  }

  const topicAction = e.target.closest('[data-topic-action]');
  if(topicAction){
    const a = topicAction.dataset.topicAction;
    if(a === 'all') state.selectedTopics = TOPICS.map(t=>t.id);
    if(a === 'clear') state.selectedTopics = [];
    renderClassicSetup(); return;
  }

  const topicRun = e.target.closest('[data-topic-run]');
  if(topicRun){
    const topic = topicRun.dataset.topicRun;
    const pool = shuffle(QUESTIONS.filter(x=>x.topic===topic)).slice(0, 15);
    if(!pool.length){ alert('Нет вопросов по теме'); return; }
    startQuizQuestions(pool, 'topic');
    return;
  }

  const filterBtn = e.target.closest('[data-filter]');
  if(filterBtn){ state.reviewFilter = filterBtn.dataset.filter; renderResult(); return; }

  // === «Ещё раз» из результата — ищем исходные сырые вопросы ===
  const restartBtn = e.target.closest('[data-restart]');
  if(restartBtn){
    const sameQs = state.questions
      .map(q => QUESTIONS.find(x => x.q === q.text))
      .filter(Boolean);
    if(!sameQs.length){ alert('Не удалось найти исходные вопросы'); return; }
    startQuizQuestions(sameQs, state.mode, {examSeconds: state.mode==='exam'?40*60:0});
    return;
  }

  const lvlBtn = e.target.closest('[data-set-level]');
  if(lvlBtn){ state.level = lvlBtn.dataset.setLevel; renderClassicSetup(); return; }

  const cntBtn = e.target.closest('[data-set-count]');
  if(cntBtn){ state.count = Number(cntBtn.dataset.setCount); renderClassicSetup(); return; }

  const flash = e.target.closest('[data-flash]');
  if(flash){
    const a = flash.dataset.flash;
    if(a === 'flip'){
      state.flashFlipped = !state.flashFlipped;
      if(state.flashFlipped){
        DATA.stats.flashViewed = (DATA.stats.flashViewed||0) + 1;
        if(DATA.stats.flashViewed >= 50) unlock('flash-50');
        saveData();
      }
      renderFlashcards();
    } else if(a === 'next'){
      if(state.flashIdx === state.flashDeck.length-1){ state.flashDeck = shuffle(Object.keys(GLOSSARY)); state.flashIdx = 0; }
      else state.flashIdx++;
      state.flashFlipped = false;
      renderFlashcards();
    } else if(a === 'prev'){
      if(state.flashIdx > 0){ state.flashIdx--; state.flashFlipped = false; renderFlashcards(); }
    }
    return;
  }
  if(e.target.closest('#flashCard')){
    state.flashFlipped = !state.flashFlipped;
    if(state.flashFlipped){
      DATA.stats.flashViewed = (DATA.stats.flashViewed||0) + 1;
      if(DATA.stats.flashViewed >= 50) unlock('flash-50');
      saveData();
    }
    renderFlashcards(); return;
  }

  const termStart = e.target.closest('[data-term-start]');
  if(termStart){
    state.termScenario = termStart.dataset.termStart;
    state.termHistory = []; state.termTaskDone = false;
    renderTerminal(); return;
  }
  if(e.target.closest('[data-term-exit]')){
    state.termScenario = null; state.termHistory = []; state.termTaskDone = false;
    renderTerminal(); return;
  }
  if(e.target.closest('[data-term-finish]')){ state.termTaskDone = true; renderTerminal(); return; }

  const tans = e.target.closest('[data-term-ans]');
  if(tans){
    const s = TERMINAL_SCENARIOS[state.termScenario];
    const i = Number(tans.dataset.termAns);
    if(i === s.correct){ toast('✅ Правильно!'); }
    else { toast('❌ Неверно'); }
    app.querySelectorAll('[data-term-ans]').forEach(b=>{
      const k = Number(b.dataset.termAns);
      b.disabled = true;
      if(k === s.correct) b.classList.add('correct');
      else if(k === i) b.classList.add('wrong');
    });
    const ex = document.createElement('div');
    ex.className = 'explain good'; ex.style.marginTop = '12px';
    ex.innerHTML = '<b>Разбор:</b> ' + linkify(s.explain);
    app.querySelector('.explain').appendChild(ex);
    return;
  }

  const go = e.target.closest('[data-go]');
  if(go){
    const dest = go.dataset.go;
    if(dest === 'home'){ state.screen='home'; render(); return; }
    if(dest === 'learn'){ state.screen='learnSetup'; state.tutorialId=null; render(); return; }
    if(dest === 'general'){ state.screen='generalSetup'; render(); return; }
    if(dest === 'classic'){ state.screen='classicSetup'; render(); return; }
    if(dest === 'flashcards'){
      state.flashDeck = shuffle(Object.keys(GLOSSARY));
      state.flashIdx = 0; state.flashFlipped = false;
      state.screen = 'flashcards'; render(); return;
    }
    if(dest === 'glossary'){ state.screen='glossary'; render(); return; }
    if(dest === 'progress'){ state.screen='progress'; render(); return; }
    if(dest === 'achievements'){ state.screen='achievements'; render(); return; }
    if(dest === 'subnet'){ state.screen='subnet'; render(); return; }
    if(dest === 'terminal'){
      state.termScenario = null; state.termHistory = []; state.termTaskDone = false;
      state.screen = 'terminal'; render(); return;
    }
    if(dest === 'settings'){ state.screen='settings'; render(); return; }

    if(dest === 'wrong'){
      const qs = wrongQuestions();
      if(!qs.length){ alert('Пока нет ошибок'); return; }
      startQuizQuestions(qs, 'wrong'); return;
    }
    if(dest === 'due'){
      const qs = dueQuestions();
      if(!qs.length){ alert('Сейчас нечего повторять'); return; }
      startQuizQuestions(qs, 'due'); return;
    }
    if(dest === 'bookmarks'){
      const qs = bookmarkedQuestions();
      if(!qs.length){ alert('Нет закладок. Отмечайте вопросы кнопкой ☆.'); return; }
      startQuizQuestions(qs, 'bookmarks'); return;
    }
    if(dest === 'exam'){
      const all = shuffle(QUESTIONS).slice(0, 40);
      startQuizQuestions(all, 'exam', {examSeconds: 40*60}); return;
    }
    if(dest === 'resume'){
      const s = DATA.session;
      if(!s) return;
      state.mode = s.mode;
      state.questions = s.questions.map(q => Object.assign(makeQuestion({
        level:q.level, topic:q.topic, type:q.type, q:q.text, explain:q.explain,
        diagram:q.diagram, opts:q.opts, answer:q.answer, accept:q.accept
      }), {answered:q.answered, chosen:q.chosen, userInput:q.userInput, userDifficulty:q.userDifficulty}));
      state.idx = s.idx;
      state.timed = s.timed;
      state.examSecondsLeft = s.examSecondsLeft || 0;
      state.screen = 'quiz';
      if(state.examSecondsLeft > 0){
        state.examTimer = setInterval(()=>{
          state.examSecondsLeft--; updateExamBanner();
          if(state.examSecondsLeft <= 0){ clearInterval(state.examTimer); finishQuiz(true); }
        }, 1000);
      }
      render(); return;
    }
  }
});

app.addEventListener('change', (e)=>{
  if(e.target.id === 'timedToggle'){ state.timed = e.target.checked; }
});

document.addEventListener('click', (e)=>{
  if(popupEl.hidden) return;
  if(e.target.closest('#termPopup')) return;
  if(e.target.closest('.term-icon')) return;
  if(e.target.closest('[data-term-open]')) return;
  hideTermPopup();
});

document.addEventListener('keydown', (e)=>{
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('term-icon')){
    e.preventDefault(); showTermPopup(e.target.closest('.term')); return;
  }
  if(e.key === 'Escape'){
    if(!popupEl.hidden){ hideTermPopup(); return; }
    if(state.screen === 'quiz'){
      const btn = app.querySelector('[data-quiz-home]');
      if(btn) btn.click();
    }
    return;
  }
  if(e.target && e.target.closest && (e.target.closest('.term-icon') || e.target.tagName === 'INPUT')) return;
  if(state.screen !== 'quiz') return;
  const q = state.questions[state.idx];
  if(!q) return;
  if(!q.answered){
    if(q.type === 'choice'){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= q.opts.length){ e.preventDefault(); handleAnswer(n-1); return; }
    }
    if(e.key === 's' || e.key === 'S'){ e.preventDefault(); skipQuestion(); return; }
  } else if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault(); nextQuestion();
  }
  if(e.key === 'b' || e.key === 'B'){
    const btn = app.querySelector('[data-bookmark]');
    if(btn) btn.click();
  }
});

window.addEventListener('resize', ()=>{ if(!popupEl.hidden) hideTermPopup(); });
window.addEventListener('scroll', ()=>{ if(!popupEl.hidden) hideTermPopup(); }, true);

render();
</script>
</body>
</html>
